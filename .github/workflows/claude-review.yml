name: Claude PR Review

# AI reviewer: comments only. It never pushes, approves or merges.
# See docs/adr/0004-ai-pr-reviewer.md. Merges are not gated by a ruleset yet.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts. Fork PRs get no secrets on public repos, so they won't run either.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read .github/claude-review-prompt.md and follow it exactly to review this pull request.
          # --strict-mcp-config: ignore the repo's .mcp.json (Playwright Test Agents server).
          # The reviewer doesn't need it, and it can't start on the runner without node_modules.
          claude_args: |
            --max-turns 20
            --strict-mcp-config
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
